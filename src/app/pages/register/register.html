<div class="retro-container">
  <div class="retro-card">
    <div class="retro-title">🌟 Criar Conta</div>
    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Nome / Apelido</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="******">
      </div>
      <button type="submit" class="btn-retro">Cadastrar</button>
    </form>
    <a routerLink="/login" class="link-sub">« Voltar para o Login</a>
  </div>
</div>
